<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#28705b">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <title>シフトビューア</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='react/style.css') }}">
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
</head>
<body data-page="app" data-api-prefix="{{ '/sample' if sample_mode else '' }}">
    <div id="root">
        {% if sample_mode %}<p>サンプル表示 · すべて架空のデータです</p>{% endif %}
        <p>画面を読み込んでいます。</p>
        <noscript>このアプリを使用するにはJavaScriptを有効にしてください。
            {% if not sample_mode %}<form method="post" action="/logout"><button type="submit">ログアウト</button></form>{% endif %}
        </noscript>
    </div>
</body>
</html>
