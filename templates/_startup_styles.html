<style>
    /* Available before the application bundle; no text is painted during startup. */
    .startup-loading { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #f1f5f9; color: #6366f1; }
    .startup-loading > [role="status"] { width: 32px; height: 32px; }
    .startup-spinner, .startup-loading [aria-hidden="true"] { display: block; flex-shrink: 0; width: 32px; height: 32px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: startup-spin .7s linear infinite; }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .startup-spinner, .startup-loading [aria-hidden="true"] { animation: none; } }
</style>
